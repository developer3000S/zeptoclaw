# Конфигурация ansible для сборки развёртывания ZeptoClaw Agent Mesh (ТЗ 15.4).
#
# Файл лежит в deploy/ansible/, поэтому запускайте плейбуки из этого каталога
# (или указывайте путь явно) — тогда roles/ находится по пути по умолчанию и
# ansible.cfg подхватывается автоматически:
#
#   cd deploy/ansible && ansible-playbook -i inventory.yml deploy.yml
#
# Если конфигурация контроллера отличается, этот файл можно пропустить
# (ANSIBLE_CONFIG=/dev/null) — он не обязателен, все нужные пути разрешаются
# через playbook_dir.

[defaults]
inventory = inventory.example.yml
roles_path = roles
host_key_checking = True
# SSH-соединение переиспользуется: на 100+ хостах это разница между минутами и
# десятками минут.
pipelining = True
forks = 20
timeout = 30
interpreter_python = auto_silent
# Повторяемые сообщения не множить в выводе.
display_skipped_hosts = False
deprecation_warnings = True
callbacks_enabled = profile_tasks

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
control_path_dir = ~/.ansible/cp

[inventory]
# Инвентарь в YAML (inventory.example.yml). Плагин включается явно: так .yml не
# путают с ini-форматом. constructed/grouped в 2.14 требуют отдельной настройки,
# здесь они не нужны.
enable_plugins = yaml, ini, auto
