---
# Обработчики.
#
# Перезапуск узла при смене конфигурации сделан НЕ обработчиком, а через метку
# com.zeptomesh.config-hash (sha256 от содержимого конфига): docker_container
# сравнивает метки как dict в режиме allow_more_present, поэтому изменение
# значения само по себе заставляет модуль пересоздать контейнер. Такой подход
# не даёт двойного bounce на свежей установке (handler сработал бы до запуска
# контейнера и ничего не перезапустил бы) и остаётся идемпотентным.

- name: Перезапустить docker
  ansible.builtin.service:
    name: docker
    state: restarted
  when: zeptomesh_docker_daemon_restart | bool
