# ZeptoClaw Agent Mesh — пример конфигурации для сети поверх Интернета (ТЗ 22.8).
#
# Назначение: узлы на разных хостах в разных сетях (в т.ч. частично за NAT).
# Обнаружение — через постоянные публичные точки входа и Kademlia DHT; mDNS
# выключен (broadcast не проходит роутеры), публичный адрес анонсируется явно.
#
# Запуск:  zeptomesh-node run -config configs/examples/wan.yaml
#
# Перед запуском заполните:
#   ZETOMESH_PUB_IP  — публичный IPv4 хоста (или задайте announce literal'ом);
#   ZETOMESH_BOOTSTRAP — не менее 1–2 публичных multiaddr действующих узлов
#   (формат: /ip4/АДРЕС/tcp/ПОРТ/p2p/PEER_ID); их добавляет загрузчик конфига.
#
# Все узлы закрытой сети обязаны использовать ОДИН ZETOMESH_PSK
# (`zeptomesh-node psk` печатает значение). PSK отсекает чужие подключения на
# уровне транспорта; подписи и trust-политика продолжают действовать поверх.

node:
  name: ${ZETOMESH_NAME:-zepto-${ZETOMESH_INDEX:-0}}
  data_dir: ${ZETOMESH_DATA:-/var/lib/zeptomesh}/${ZETOMESH_INDEX:-0}
  listen:
    - /ip4/0.0.0.0/tcp/${ZETOMESH_MESH_PORT:-4001}
    - /ip4/0.0.0.0/udp/${ZETOMESH_MESH_PORT:-4001}/quic-v1
  # Без явного анонса узел за NAT рекламирует приватные адреса, до него нельзя
  # достучаться. Укажите публичный адрес этого хоста.
  announce:
    - /ip4/${ZETOMESH_PUB_IP:-127.0.0.1}/tcp/${ZETOMESH_MESH_PORT:-4001}
    - /ip4/${ZETOMESH_PUB_IP:-127.0.0.1}/udp/${ZETOMESH_MESH_PORT:-4001}/quic-v1
  private_network_psk: ${ZETOMESH_PSK:-}
  # Circuit relay v2 (ТЗ 6.3.3.4).
  # enabled=true — узел сам пользуется реле, когда до соседа нет прямого пути;
  # advertise_as_relay=true — узел разрешает транзит ЧУЖИХ соединений и тратит
  # на это лимиты ниже. Реле видит только шифрованные байты (Noise/TLS сквозные).
  # Узел за строгим NAT без прямого пути может выставить advertise_as_relay=false.
  relay:
    enabled: true
    advertise_as_relay: false
    # Явные реле предпочтительнее поиска; пусто → кандидаты из DHT.
    static_relays:
      - ${ZETOMESH_RELAY_1:-}
    limit:
      max_reservations: 64
      max_circuits: 8
      reservation_ttl: 1h
      conn_duration: 2m
      conn_data_bytes: 131072   # 128 KiB на направление, затем сброс соединения

identity:
  key_file: ""                  # пусто → <data_dir>/keys/peer.key

discovery:
  local_registry: true
  local_socket_dir: ""
  mdns: false                   # в WAN broadcast недоступен
  mdns_service_name: _zeptomesh._udp
  # Точки входа заполняются через env (config.applyEnvOverrides дописывает
  # ZETOMESH_BOOTSTRAP в этот список). 2–3 независимых узла = устойчивый вход.
  bootstrap: []
  dht: true
  dht_mode: server              # WAN-узлы держат DHT-таблицу для остальных
  peer_exchange: true
  bootstrap_interval: 30s
  # Активный обход окружения (`zeptomesh-node scan` / POST /api/v1/admin/scan);
  # выключен по умолчанию. В WAN обзор опирается на DHT/bootstrap/peer-exchange,
  # а subnet_scan бессмысленен за NAT: перебирать пришлось бы чужие /24.
  scan:
    enabled: ${ZETOMESH_SCAN_ENABLED:-false}
    interval: 30m               # реже: внешние поискы дороже по трафику
    subnet_scan: ${ZETOMESH_SCAN_SUBNET:-false}
    dial_timeout: 8s            # WAN-RTT выше
    timeout: 60s
    max_candidates: 64
  gossip:
    enabled: true
    topic: /zeptomesh/membership/0.1.0
    heartbeat: 5s               # в интернете реже: дешевле по трафику
    full_sync: 120s
    failure_timeout: 30s

neighbors:
  min: 8
  target: 16
  max: 64

tasks:
  default_ttl: 5
  max_ttl: 10
  max_parallel_tasks: 4
  max_parallel_tasks_per_peer: 2
  default_timeout_seconds: 600
  max_timeout_seconds: 3600
  max_task_payload_bytes: 1048576
  max_artifact_bytes: 104857600
  max_workspace_bytes: 536870912
  min_free_disk_bytes: 1073741824
  max_task_memory_bytes: 1073741824
  dedup_window: 15m
  retention: 168h
  forwarding:
    max_fanout: 5
    max_parallel_candidates: 3
    max_retries: 2
    attempt_timeout: 120s
    retry_interval_seconds: 5s
    search_relay:
      enabled: true
      max_depth: 2              # WAN разрежен: два хопа поиска
      fanout: 3
      request_timeout: 8s
      cache_ttl: 60s

capabilities:
  skills: [general]
  models: []
  resource_class: medium
  accept_external_tasks: false  # узел в Интернете по умолчанию НЕ принимает чужие
                                # задачи: включите осознанно или ограничьте
                                # allow-списком ниже
  allow_shell: false
  allow_network_tools: false
  max_parallel_tasks: 4
  disabled_skills: []
  # Документация объявленных навыков: что узел рассказывает о них соседям.
  # Права на исполнение она не даёт — право даёт только skills выше.
  skill_docs:
    - name: general
      version: 1
      description: "Универсальные задачи агента; внешних интеграций нет."
      models: []
      attributes: {zone: wan}
  # Обмен описаниями (дельта-синхронизация skills_sync). В публичной сети
  # раскрытие держим консервативным: незнакомые узлы видят только имена.
  skill_exchange:
    enabled: true
    disclose_to: trusted    # trusted | known | any
    interval: 30s
    max_descriptors: 64
    import_limit: 512
    persist: true

picoclaw:
  mode: ${ZETOMESH_PICO_MODE:-stub}
  binary: ${ZETOMESH_PICO_BIN:-picoclaw}
  config: ${ZETOMESH_PICO_CONFIG:-}
  timeout_seconds: 600
  max_concurrent_agents: 4
  extra_args: []
  prompt_template: ""
  env: {}
  http:
    base_url: ${ZETOMESH_PICO_WS_URL:-http://127.0.0.1:18790}
    path: /pico/ws
    health_path: /health
    token_env: PICOCLAW_MESH_PICO_TOKEN
    timeout_seconds: 600
  stub:
    latency: 50ms
    echo: true

security:
  # limited + явные списки: в WAN принимайте задачи только от известных узлов.
  trust_mode: ${ZETOMESH_TRUST_MODE:-limited}
  require_task_signature: true
  drop_invalid_signatures: true
  min_trust_for_tasks: known
  # base58 peer id, по одному на строку; # — комментарий.
  allowed_peers_file: ${ZETOMESH_ALLOWED_PEERS:-/etc/zeptomesh/allowed_peers.txt}
  blocked_peers_file: ${ZETOMESH_BLOCKED_PEERS:-/etc/zeptomesh/blocked_peers.txt}
  max_message_bytes: 4194304
  rate_limit:
    requests_per_second: 10     # из Интернета — строже
    burst: 30

api:
  enabled: true
  # Никогда не поднимайте API на 0.0.0.0 без токена; локальный доступ + SSH —
  # штатный путь администрирования удалённого узла.
  listen: ${ZETOMESH_API_HOST:-127.0.0.1}:${ZETOMESH_API_PORT:-8081}
  auth_token_env: ZETOMESH_API_TOKEN
  read_timeout: 15s
  write_timeout: 600s

telemetry:
  # Скрейпит тот же Prometheus, что и остальные узлы; при необходимости —
  # обратный SSH-туннель вместо публичного порта.
  prometheus_listen: ${ZETOMESH_PROM_LISTEN:-127.0.0.1:9464}
  log_level: ${ZETOMESH_LOG_LEVEL:-info}
  structured_logs: true

storage:
  engine: badger
  dir: ""
  max_task_records: 100000
