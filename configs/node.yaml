# ZeptoClaw Agent Mesh — шаблон узла.
#
# Значения ${VAR:-default} подставляет загрузчик конфигурации, поэтому один
# файл обслуживает сколько угодно экземпляров на одном хосте: достаточно
# передать разные ZETOMESH_INDEX / порты.
#
#   ZETOMESH_INDEX   порядковый номер экземпляра (0,1,2,…)
#   ZETOMESH_MESH_PORT TCP/QUIC-порт mesh этого экземпляра (install.sh: 4001+i)
#   ZETOMESH_API_PORT порт админ-API этого экземпляра (install.sh: 8081+i)
#   ZETOMESH_DATA    корень данных (в Docker это /var/lib/zeptomesh)
#   ZETOMESH_BOOTSTRAP необязательный "/ip4/…/p2p/…" адрес входа в сеть

node:
  name: ${ZETOMESH_NAME:-zepto-${ZETOMESH_INDEX:-0}}
  data_dir: ${ZETOMESH_DATA:-./zeptomesh-data}/${ZETOMESH_INDEX:-0}
  listen:
    - /ip4/0.0.0.0/tcp/${ZETOMESH_MESH_PORT:-4001}
    - /ip4/0.0.0.0/udp/${ZETOMESH_MESH_PORT:-4001}/quic-v1
  announce: []
  # Закрытая сеть libp2p: один и тот же ключ у всех узлов сети, чужие
  # соединения отбрасываются на уровне транспорта. Формат — вывод
  # `zeptomesh-node psk`: "/1/<base32 от 32 байт>"; hex-строка не принимается.
  # ВНИМАНИЕ: QUIC не поддерживает закрытые сети (go-libp2p), поэтому с
  # непустым PSK узел поднимает только TCP — quic-v1-адреса ниже игнорируются.
  private_network_psk: ${ZETOMESH_PSK:-}
  # Circuit relay (libp2p relay v2): помощь узлам за NAT.
  #  enabled            — пользоваться чужими ретрансляторами, когда прямое
  #                       соединение недоступно;
  #  advertise_as_relay — разрешить транзит трафика другим узлам;
  #  static_relays      — явные адреса ретрансляторов (иначе — поиск через DHT);
  #  limit              — потолок резервирований/схем и одна ретранслируемая
  #                       сессия по длительности и объёму.
  relay:
    enabled: true
    advertise_as_relay: ${ZETOMESH_RELAY_ADVERTISE:-false}
    static_relays: []
    limit:
      max_reservations: 128
      max_circuits: 16
      reservation_ttl: 1h
      conn_duration: 2m
      conn_data_bytes: 131072

identity:
  key_file: ${ZETOMESH_DATA:-./zeptomesh-data}/${ZETOMESH_INDEX:-0}/keys/peer.key

discovery:
  local_registry: true
  local_socket_dir: ${ZETOMESH_DATA:-./zeptomesh-data}/${ZETOMESH_INDEX:-0}/run
  mdns: ${ZETOMESH_MDNS:-true}
  mdns_service_name: _zeptomesh._udp
  bootstrap: []
  dht: true
  dht_mode: ${ZETOMESH_DHT_MODE:-auto}
  peer_exchange: true
  bootstrap_interval: 30s
  gossip:
    enabled: true
    topic: /zeptomesh/membership/0.1.0
    heartbeat: 3s
    full_sync: 60s
    failure_timeout: 15s

neighbors:
  min: 6
  target: 12
  max: 48

tasks:
  default_ttl: 5
  max_ttl: 10
  max_parallel_tasks: 4
  # Сколько задач одновременно может занять один инициатор (защита от
  # "один сосед съел все слоты"); 0 = без ограничения.
  max_parallel_tasks_per_peer: 2
  default_timeout_seconds: 600
  # Потолок времени выполнения: больше запросить можно, но узел всё равно
  # обрежет до этого значения.
  max_timeout_seconds: 3600
  max_task_payload_bytes: 1048576
  max_artifact_bytes: 104857600
  # Квоты ресурсов исполняемой задачи (ТЗ 6.8.4): 0 = не ограничивать.
  max_workspace_bytes: 536870912        # размер артефактов из workspace
  min_free_disk_bytes: 1073741824       # не брать задачу, если диск забит
  max_task_memory_bytes: 1073741824     # RLIMIT_AS процесса PicoClaw
  dedup_window: 15m
  retention: 168h
  forwarding:
    max_fanout: 5
    max_parallel_candidates: 3
    max_retries: 2
    attempt_timeout: 120s
    retry_interval_seconds: 5s
    # search_relay — лестница расширения поиска исполнителя, когда локальная
    # таблица соседей ничего не дала. Адресная часть (enabled) делает full
    # refresh и ограниченный RPC-relay по соседям. Epidemic-часть (topic)
    # публикует подписанный запрос НАВЫКОВ (без task_id и инструкции) в общий
    # pubsub-топик: подписавшиеся узлы, которые могут закрыть навык, отвечают
    # подписанным списком кандидатов. По умолчанию выключена — это шаг с самой
    # широкой зоной раскрытия. Меняется только перезапуском (топик join'ится на
    # старте). Ответы — заявления третьих лиц: прежде чем маршрутизировать,
    # каждый кандидат обзванивается и проверяется по его собственной подписи.
    # search_relay:
    #   enabled: true
    #   max_depth: 2
    #   fanout: 3
    #   request_timeout: 8s
    #   cache_ttl: 60s
    #   topic:
    #     enabled: false
    #     name: "/zeptomesh/skillsearch/0.1.0"
    #     request_ttl: 30s     # устаревшие запросы не отвечаются
    #     max_answers: 8       # сколько ответов собрать / сколько записей в одном
    #     answer_cooldown: 10s # анти-шторм: не чаще одного ответа на набор навыков

capabilities:
  skills: [general]
  models: []
  resource_class: medium
  accept_external_tasks: true
  allow_shell: false
  allow_network_tools: true
  max_parallel_tasks: 4
  disabled_skills: []
  # Документация объявленных навыков (capabilities.skill_docs): что узел
  # рассказывает о них соседям. Права на исполнение она не даёт — право даёт
  # только список skills выше, поэтому ни API, ни импорт от соседа не могут
  # расширить полномочия узла.
  skill_docs: []
  #   - name: ocr
  #     version: 2
  #     description: "Распознавание сканов, русский/английский."
  #     models: [pico-vision]
  #     attributes: {gpu: "true", owner: team-a}
  # Дельта-обмен этими описаниями (RPC skills_sync): узел сравнивает свой
  # epoch (capabilities.skills_version) с соседом и подтягивает только более
  # новые дескрипторы. disclose_to: trusted | known (по умолчанию) | any.
  skill_exchange:
    enabled: true
    disclose_to: known
    interval: 30s
    max_descriptors: 64   # потолок одного ответа
    import_limit: 512     # потолок выученных описаний одного соседа
    persist: true         # <data_dir>/skills.json — часы версий переживают рестарт

picoclaw:
  # stub | binary | http  — подробнее в docs/PICOCLAW-INTEGRATION.md
  mode: ${ZETOMESH_PICO_MODE:-stub}
  binary: ${ZETOMESH_PICO_BIN:-picoclaw}
  config: ${ZETOMESH_PICO_CONFIG:-}
  # Корень рабочих каталогов задач (ТЗ 10.3 «рабочая директория»): под ним
  # создаётся отдельный каталог на задачу, и именно он передаётся агенту через
  # PICOCLAW_AGENTS_DEFAULTS_WORKSPACE. Пусто → <data_dir>/picoclaw/workspaces.
  # Квота на объём задаётся не здесь, а tasks.max_workspace_bytes.
  workspace_root: ${ZETOMESH_PICO_WORKSPACE:-}
  timeout_seconds: 600
  max_concurrent_agents: 4
  # ТЗ 10.3 «модельные параметры»: модель по умолчанию для локального агента.
  # Это свойство узла, а не задачи — в протоколе mesh выбора модели нет, поэтому
  # сосед не может попросить другую модель. Пусто → решает конфигурация PicoClaw.
  # Действует только в режиме binary (там оно становится --model): у Pico
  # Protocol (http) поля выбора модели в запросе нет, в ответе читается только
  # model_name. Прочие модельные параметры (temperature, max_tokens) задаются не
  # здесь: `picoclaw agent` принимает только -d/-m/-s/--model, они живут в env
  # ниже (PICOCLAW_AGENTS_DEFAULTS_TEMPERATURE, …) или в файле picoclaw.config.
  model: ${ZETOMESH_PICO_MODEL:-}
  extra_args: []
  prompt_template: ""
  env: {}
  http:
    base_url: ${ZETOMESH_PICO_WS_URL:-http://127.0.0.1:18790}
    path: /pico/ws
    health_path: /health
    token_env: PICOCLAW_MESH_PICO_TOKEN
    timeout_seconds: 600
  stub:
    latency: 50ms
    echo: true

security:
  trust_mode: ${ZETOMESH_TRUST_MODE:-limited}
  require_task_signature: true
  # Транспортная подпись доказывает, кто отправил конверт; авторская
  # (origin_signature) доказывает, что содержимое не переписал промежуточный узел.
  # Отсутствующая авторская подпись отсекается только этим флагом — узлы,
  # поднятые до появления поля, остаются приемлемыми, если его выключить;
  # присутствующая, но неверная отбрасывается всегда (ТЗ 6.6.4, 11.5).
  require_origin_signature: true
  drop_invalid_signatures: true
  allowed_peers_file: ${ZETOMESH_ALLOWED_PEERS:-}
  blocked_peers_file: ${ZETOMESH_BLOCKED_PEERS:-}
  min_trust_for_tasks: limited
  max_message_bytes: 4194304
  rate_limit:
    requests_per_second: 20
    burst: 60

api:
  enabled: true
  listen: ${ZETOMESH_API_HOST:-127.0.0.1}:${ZETOMESH_API_PORT:-8081}
  auth_token_env: ZETOMESH_API_TOKEN
  read_timeout: 15s
  write_timeout: 600s

telemetry:
  log_level: ${ZETOMESH_LOG_LEVEL:-info}
  structured_logs: true
  # Метрики отдаёт и админ-API (/metrics, с bearer-токеном). Отдельный
  # слушатель нужен, когда Prometheus скрейпит порт без токена: держите его на
  # внутреннем интерфейсе. В Docker — 0.0.0.0, иначе порт не будет опубликован.
  prometheus_listen: ${ZETOMESH_PROM_LISTEN:-}
  # Трассировка OpenTelemetry (ТЗ 14.3) — выключена по умолчанию: узел, который
  # её не упоминает, не подключает ни SDK, ни экспортёр. Контекст трейса едет
  # внутри задачи в подписанных labels, поэтому промежуточный узел не может его
  # переписать, а старый сосед просто пронесёт два лишних ключа. Секция меняется
  # только рестартом: SDK ставит глобальные провайдеры один раз при старте
  # процесса (reload отнесёт её к requires_restart).
  # tracing:
  #   enabled: true
  #   endpoint: "localhost:4318"   # host:port OTLP/HTTP, без схемы и пути
  #   insecure: true               # plaintext — обычно то, что ждёт локальный
  #                                # collector (Jaeger, Tempo, otel-collector)
  #   sample_ratio: 0.1            # вероятность для трейсов, НАЧАТЫХ этим узлом;
  #                                # пришедший трассированный трейс не усекается
  #   service_name: zeptomesh-node # имя сервиса в collector
  #   environment: prod

storage:
  engine: badger
  dir: ${ZETOMESH_DATA:-./zeptomesh-data}/${ZETOMESH_INDEX:-0}/db
  max_task_records: 100000

# Плановые триггеры (ТЗ 6.6.1 п.4) — четвёртый источник задач: узел сам
# подставляет себе задачу по cron-выражению, как если бы оператор вызвал
# `zeptomesh-node submit`. Разрешение cron — минутное; запуски, пропущенные
# во время простоя, НЕ доигрываются (задача на 09:00 не придёт в 14:00).
# Список перечитывается на горячую (reload). Эти записи закреплённые: API и CLI
# не могут удалить или перезаписать id из этого списка (POST с тем же id
# отклоняется), чтобы YAML оставался старшим источником истины. Триггеры,
# созданные через API, лежат в хранилище узла и видны в `zeptomesh-node
# triggers` наравне с этими.
# triggers:
#   - id: nightly-vacuum          # уникальный id — обязателен
#     name: Ночная уборка workspace
#     schedule: "0 3 * * *"       # minute hour dom month dow, по UTC
#     enabled: true               # по умолчанию true
#     max_runs: 0                 # >0 — остановиться после N запусков
#     job:
#       instruction: "Удалить файлы старше 7 дней из рабочей области"
#       required_skills: [general] # маршрутизация как у обычной задачи
#       ttl: 5                     # прыжков; 0 = tasks.default_ttl
#       priority: 0                # 1..9; 0 = по умолчанию
#       timeout_seconds: 600       # 0 = tasks.default_timeout_seconds
#       allow_shell: false         # разрешить агенту shell (ТЗ 11.4)
#       allow_network_tools: true  # разрешить сетевые инструменты

